<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzBuzz</title>
    <meta name="author" content="Ignacio Orellana">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="contenedor">
        <h1>Práctica FizzBuzz</h1>
        <div class="card">
            <h2>Reglas FizzBuzz</h2>
            <p>Si el número es divisible por 3, muestra "Fizz".</p>
            <p>Si el número es divisible por 5, muestra "Buzz".</p>
            <p>Si el número es divisible por ambos, muestra "FizzBuzz".</p>
            <p>Si no es divisible por ninguno, muestra el número.</p>
            <p>Si encuentra un fizzbuzz, detiene la ejecución.</p>
            <button onclick="fizzBuzz()">Ejecutar</button>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>

</html>
