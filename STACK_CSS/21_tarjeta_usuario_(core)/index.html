<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/style.css">
    <meta name="author" content="Igancio Orellana">
    <title>Tarjeta de Usuario</title>
</head>
<body>
<section class="tarjeta-usuario">
    <div class="tarjeta-usuario-header">
        <img src="static/images/images.jfif" alt="Avatar" class="tarjeta-usuario__avatar">
        <h1 class="tarjeta-usuario__nombre">Kinger king</h1>
        <h2 class="tarjeta-usuario__titulo">Desarrollador de IA Creativa</h2>
    </div>
    <div class="tarjeta-body">
        <p class="tarjeta-usuario__info">Programador con 30 años de experiencia en HTML, CSS y JavaScript.
            Especializado en desarrollo de ia creativa y creador de "Caine".
        </p>
        <div class="tarjeta-redes">
            <a href="https://the-amazing-digital-circus-en-espanol.fandom.com/es/wiki/Kinger" class="tarjeta-usuario__red-social">wiki</a>
            <a href="https://www.linkedin.com/in/kinger-king-206305412" class="tarjeta-usuario__red-social">LinkedIn</a>
            <a href="https://github.com/kinger-king" class="tarjeta-usuario__red-social">GitHub</a>
        </div>
        <button class="tarjeta-usuario__boton">Conectar</button>
    </div>
</section>
</body>
</html>
